x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest@sha256:8e505886ba5da6788f1b9dfc62a25e2f2c3a96e64e6528ef7278d7e1d6649bd2
    container_name: wireguard
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - /etc/wireguard:/config/wg_confs
      - /lib/modules:/lib/modules:ro
    healthcheck:
      test: ['CMD-SHELL', 'wg show wg0 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  backend:
    build: ./backend
    network_mode: host
    cap_add:
      - NET_ADMIN
    env_file:
      - ./backend/.env
    volumes:
      - /etc/wireguard:/etc/wireguard
      - backend_uploads:/app/uploads
      - ./backend/secrets:/app/secrets:ro
      # Shared with the freeradius container so the backend can run
      # read-only `radmin -e "show clients"` probes for reconciliation
      # and router-health checks.
      - freeradius_control:/var/run/freeradius
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wireguard:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  postgres:
    image: postgres:16-alpine@sha256:93d55776e04376e19adb2733e3ccebb4392ee7dd86d8ff238503b30fe719c84f
    # Tuning knobs are env-interpolated so staging (1 vCPU / 3.9 GB shared box)
    # keeps safe defaults and prod sets larger values in /etc/wasel/compose.env.
    #
    # Prod values for /etc/wasel/compose.env (add before `up -d postgres`):
    #   POSTGRES_MEM_LIMIT=3g
    #   POSTGRES_CPUS=1.5
    #   POSTGRES_SHARED_BUFFERS=1GB
    #   POSTGRES_EFFECTIVE_CACHE_SIZE=2GB
    #   POSTGRES_WORK_MEM=16MB
    #   POSTGRES_MAINTENANCE_WORK_MEM=128MB
    #   POSTGRES_SHM_SIZE=256mb
    #
    # Why: the cgroup mem_limit also caps the page cache, so the old 1 GB cap
    # was simultaneously capping shared_buffers *and* the OS buffer cache.
    # Prod cache hit ratio was 37.5 % (8.57 TB read from disk in 4 months) and
    # the container was CPU-throttled 18 % of periods — a direct contributor to
    # the FreeRADIUS SQL starvation that triggered the 2026-09-15 hang.
    # Staging runs 1 vCPU / 3.9 GB shared with another stack, so defaults stay
    # small.
    command:
      - postgres
      - -c
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - -c
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}"
      - -c
      - "work_mem=${POSTGRES_WORK_MEM:-8MB}"
      - -c
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}"
      - -c
      - "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"
    shm_size: ${POSTGRES_SHM_SIZE:-128mb}
    environment:
      POSTGRES_DB: wasel
      POSTGRES_USER: wasel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in compose env-file}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wasel']
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1.0}

  redis:
    image: redis:7-alpine@sha256:efc27681bf81e6ed55cb581718b7818c6c04c39b1f9aa40854edd3ea2241b6ed
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in compose env-file}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  freeradius:
    # Build a customised image from ./freeradius (adds postgresql driver + sql
    # module). The real supply-chain pin lives in freeradius/Dockerfile's FROM
    # line; the `image:` here is just the local tag buildx applies — a digest
    # alongside `build:` is rejected by modern buildx.
    build: ./freeradius
    image: wasel-freeradius:3.2.8
    # init: true places docker-init as PID 1 and freeradius as a child process.
    # Before incident 2026-09-15 freeradius was PID 1; a process cannot be
    # SIGKILLed from inside its own PID namespace, so the watchdog kill and
    # `kill -STOP` simulation tests were both no-ops.  docker-init also
    # forwards SIGTERM on `docker stop`, so graceful shutdown still works.
    init: true
    network_mode: host
    environment:
      RADIUS_DB_HOST: 127.0.0.1
      RADIUS_DB_PORT: 5432
      RADIUS_DB_NAME: wasel
      RADIUS_DB_USER: wasel
      RADIUS_DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in compose env-file}
    volumes:
      # Shared with the backend container for read-only radmin probes
      # (`radmin -e "show clients"`). Dynamic clients are loaded via SQL
      # at FR startup — no HUP or container restart needed for new NAS rows.
      - freeradius_control:/var/run/freeradius
    depends_on:
      postgres:
        condition: service_healthy
      wireguard:
        condition: service_healthy
    healthcheck:
      # wasel-healthcheck sends a Status-Server packet and kills freeradius
      # after FR_WATCHDOG_KILL_AFTER (8, ~3 min) consecutive failures when the
      # main thread is spinning on CPU, or FR_WATCHDOG_KILL_AFTER_STALLED
      # (30, ~10 min) when it is blocked, e.g. on a stalled DB.  The old
      # `pgrep freeradius` check kept reporting healthy during the 2026-09-15
      # incident because the process existed but was stuck in a libtalloc loop.
      test: ['CMD', '/usr/local/bin/wasel-healthcheck']
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  admin:
    build: ./admin
    ports:
      - '127.0.0.1:5173:5173'
    environment:
      # API origin baked into the CSP (connect-src/img-src) via nginx envsubst
      # templating at container start. Prod default below keeps prod working
      # with no .env change; staging overrides API_ORIGIN=https://api.wa-sel.cloud
      # in its .env.
      API_ORIGIN: ${API_ORIGIN:-https://api.wa-sel.com}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

  landing:
    build: ./landing
    ports:
      - '127.0.0.1:8080:80'
    # Deliberately no depends_on: the landing page is fully static and must
    # stay up even when the backend is down.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  freeradius_control:
