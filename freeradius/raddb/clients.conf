#
#  clients.conf — RADIUS client definitions
#
#  Every router NAS is resolved via dynamic_client_server (sites-enabled/
#  dynamic-clients), which queries the PostgreSQL `nas` table by source
#  IP on demand and caches the resolved client in memory.
#  read_clients is OFF in mods-enabled/sql — boot-time bulk loading was
#  removed because it produced static in-memory clients with no way to
#  refresh, which made delete-then-recreate-same-tunnel-IP swaps fail
#  silently until a FreeRADIUS restart. One source of truth = the live
#  nas table.
#
#  BlastRADIUS (CVE-2024-3596) mitigations (require_message_authenticator,
#  limit_proxy_state) are configured globally in radiusd.conf's security{}
#  block so that dynamically-built clients inherit them. Do not set those
#  here — per-stanza settings do not template onto dynamic clients.
#

#
#  Localhost — for radtest and health checks from the same host.
#  Trusted loopback. The Status-Server watchdog probe in
#  freeradius/healthcheck.sh and the backend admin card both authenticate
#  with this secret against 127.0.0.1:1812.
#
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    nas_type = other
}

#
#  WireGuard tunnel subnet — dynamic NAS resolution.
#
#  Any source IP in 10.10.0.0/16 triggers the dynamic_client_server
#  vserver on first packet (or on first packet after this entry is
#  explicitly evicted). The vserver looks the NAS up in the `nas` table
#  by source IP and populates the in-memory client.
#
#  lifetime = 0: upstream 3.2.x — "Lives forever. Return it." Cached
#  clients never auto-expire.
#
#  Incident 2026-09-15: with lifetime > 0 an expired dynamic client is
#  freed on a timer inside listen.c (max_request_time + 20 s) with NO
#  reference counting. A request that was still parked in rlm_sql when
#  the timer fired kept a dangling pointer into the freed struct; the
#  next talloc walk corrupted the pool and the main thread spun in
#  libtalloc for 5 h while Docker's pgrep healthcheck said "healthy".
#  Setting lifetime = 0 removes the periodic expiry (~420 timed frees
#  per hour with 120 s). It does NOT remove the timed free itself: see
#  the eviction note below.
#
#  The backend explicitly evicts the cached client with
#  `radmin -e "del client ipaddr <ip>"` on router create, router delete
#  and admin user delete (see backend/src/services/freeradius.service.ts
#  → evictDynamicClient). That keeps reuse-of-a-freed-tunnel-IP working:
#  the new router's shared secret is picked up on the next packet.
#
#  Eviction still uses the same timed free. `del client` only marks the
#  client dead (lifetime = 1). The next packet from that IP makes
#  listen.c delete it and free it max_request_time + 20 s later, with no
#  refcount. Each eviction is therefore safe only if no request from
#  that IP can still be stuck in SQL when the free runs. That is why
#  router delete and admin user delete remove the WireGuard peer before
#  evicting.
#
#  Operator note: after any manual edit to the `nas` table (secret,
#  nasname, shortname), run
#      radmin -e "del client ipaddr <ip>"
#  from inside the freeradius container, or restart FreeRADIUS. Without
#  eviction the cached client keeps the stale secret indefinitely. Only
#  evict a live router while the DB is healthy. If Postgres is slow
#  ("unfinished request" lines in the log), restart FreeRADIUS instead.
#
client lookup_wasel_nas {
    ipaddr          = 10.10.0.0/16
    dynamic_clients = dynamic_client_server
    lifetime        = 0
}

# Unknown source IPs OUTSIDE 10.10.0.0/16 still produce the upstream
# "Ignoring request ... from unknown client <ip>" log line — no fallback
# /16 stanza intercepts them. A previous placeholder default_wg_routers
# block with secret=PLACEHOLDER_OVERRIDDEN_BY_NAS_TABLE was removed
# (commit 8cecf56) because it caused silent HMAC failures, and must NOT
# be reintroduced.
